name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/app
      BETTER_AUTH_SECRET: segredo-somente-para-o-ci-nao-usar-em-producao
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Camargo MES
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit; else npm install --no-audit; fi

      - name: Testes do domínio (sequenciador, arraste, MES)
        run: npm test

      # A migration versionada precisa refletir o schema: gerar não pode criar nada novo.
      - name: Conferir migration em dia com o schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error title=Migration desatualizada::Rode npm run db:generate e inclua a migration no commit."
            exit 1
          fi

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Sobe o servidor de produção uma vez e confere a tela de entrada.
      # Se falhar, publica o fim do log como anotação de erro da execução.
      - name: Subir o servidor e conferir
        run: |
          cp -r .next/static .next/standalone/.next/ && cp -r public drizzle .next/standalone/
          HOSTNAME=0.0.0.0 PORT=3000 node .next/standalone/server.js > servidor.log 2>&1 &
          PID=$!
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/entrar || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "GET /entrar -> $code"
          kill $PID || true
          if [ "$code" = "000" ] || [ "$code" -ge 404 ]; then
            msg=$(tail -c 6000 servidor.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Servidor respondeu $code::${msg}"
            exit 1
          fi

      - name: Instalar navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: |
          HOSTNAME=0.0.0.0 PORT=3000 node .next/standalone/server.js > servidor-e2e.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/entrar && break; sleep 2; done
          E2E_SERVIDOR_EXTERNO=1 npx playwright test

      # Se algum teste falhar, os erros do servidor aparecem como anotação da execução.
      - name: Erros do servidor durante os testes
        if: failure()
        run: |
          erros=$(grep -n -A 25 -E "⨯|Error|error" servidor-e2e.log | head -c 8000 || true)
          [ -z "$erros" ] && erros=$(tail -c 4000 servidor-e2e.log)
          msg=$(printf "%s" "$erros" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Log do servidor (e2e)::${msg}"

      - name: Capturas em texto (1/4)
        if: always() && contains(github.event.head_commit.message, '[capturas]')
        run: sh .github/capturas.sh 0

      - name: Capturas em texto (2/4)
        if: always() && contains(github.event.head_commit.message, '[capturas]')
        run: sh .github/capturas.sh 10

      - name: Capturas em texto (3/4)
        if: always() && contains(github.event.head_commit.message, '[capturas]')
        run: sh .github/capturas.sh 20

      - name: Capturas em texto (4/4)
        if: always() && contains(github.event.head_commit.message, '[capturas]')
        run: sh .github/capturas.sh 30

      - name: Relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # Reproduz o deploy da VPS (infra/vps): build dentro do node:22-alpine com a pasta
  # montada e o servidor subindo do mesmo jeito da stack Swarm.
  simular-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mes
          POSTGRES_PASSWORD: mes
          POSTGRES_DB: mes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mes -d mes"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Arquivo de ambiente (como /root/mes.env)
        run: |
          {
            echo "DATABASE_URL=postgres://mes:mes@127.0.0.1:5432/mes"
            echo "BETTER_AUTH_SECRET=segredo-somente-para-o-ci-nao-usar-em-producao"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_NAME=Camargo MES"
            echo "FUSO_FABRICA=America/Sao_Paulo"
          } > /tmp/mes.env

      - name: Build igual ao da VPS
        run: docker run --rm --env-file /tmp/mes.env -v "$PWD":/app node:22-alpine sh /app/infra/vps/build.sh

      - name: Subir igual à stack e conferir
        run: |
          docker run -d --name mes --network host --env-file /tmp/mes.env \
            -e PORT=3000 -e HOSTNAME=0.0.0.0 -e NODE_ENV=production -e TZ=America/Sao_Paulo \
            -v "$PWD":/app -w /app/.next/standalone node:22-alpine node server.js
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/configurar || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs mes 2>&1 | tail -20
          echo "GET /configurar -> $code"
          if [ "$code" != "200" ]; then
            msg=$(docker logs mes 2>&1 | tail -c 4000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=VPS simulada respondeu $code::${msg}"
            exit 1
          fi
          docker logs mes 2>&1 | grep -q "Banco atualizado" || { echo "::error title=VPS simulada::migrations não rodaram"; exit 1; }
